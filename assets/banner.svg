<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title description">
  <title id="title">Hello, world!</title>
  <desc id="description">A minimal developer banner with soft blue and lavender waves and a blinking terminal cursor.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="0.3">
      <stop stop-color="#DCEEF8"/>
      <stop offset="0.55" stop-color="#DCEEF8"/>
      <stop offset="1" stop-color="#D8C7F0"/>
    </linearGradient>
    <linearGradient id="blue" x2="1" y2="0">
      <stop stop-color="#A8D8EA"/>
      <stop offset="1" stop-color="#B8C6F2"/>
    </linearGradient>
    <linearGradient id="lavender" x2="1" y2="0">
      <stop stop-color="#B8C6F2"/>
      <stop offset="1" stop-color="#D8C7F0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="180" rx="16"/></clipPath>
  </defs>
  <style>
    .wave { animation: drift 12s ease-in-out infinite alternate; }
    .wave-back { animation-duration: 18s; animation-direction: alternate-reverse; }
    .wave-front { animation-duration: 15s; }
    .cursor { animation: blink 1.6s steps(1, end) infinite; }
    @keyframes drift {
      from { transform: translate(-75px, -4px); }
      to { transform: translate(75px, 4px); }
    }
    @keyframes blink {
      0%, 55%, 100% { opacity: 1; }
      56%, 99% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave, .cursor { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="180" fill="url(#background)"/>
    <path class="wave wave-back" d="M-120 42 C100 4 220 74 440 40 S800 8 1020 38 S1240 70 1320 28 V-40 H-120Z" fill="url(#lavender)" opacity="0.32"/>
    <path class="wave" d="M-120 134 C80 80 260 168 480 133 S800 92 1020 130 S1230 156 1320 112 V220 H-120Z" fill="url(#blue)" opacity="0.44"/>
    <path class="wave wave-front" d="M-120 157 C120 121 300 192 550 154 S900 126 1080 151 S1250 180 1320 151 V220 H-120Z" fill="url(#lavender)" opacity="0.48"/>
  </g>
  <g fill="#243B53" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="42" font-weight="500">
    <text x="600" y="90" dy="0.35em" text-anchor="middle">Hello, world!</text>
    <text class="cursor" x="765" y="90" dy="0.35em" aria-hidden="true">_</text>
  </g>
</svg>
