<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title description">
  <title id="title">Hello, world!</title>
  <desc id="description">A minimal developer banner with soft blue and lavender waves and a blinking terminal cursor.</desc>
  <defs>
    <linearGradient id="blue" x2="1" y2="0">
      <stop stop-color="#A8D8EA"/>
      <stop offset="1" stop-color="#B8C6F2"/>
    </linearGradient>
    <linearGradient id="lavender" x2="1" y2="0">
      <stop stop-color="#B8C6F2"/>
      <stop offset="1" stop-color="#D8C7F0"/>
    </linearGradient>
    <linearGradient id="edge-fade">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.12" stop-color="white"/>
      <stop offset="0.88" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="soft-edges" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="180">
      <rect width="1200" height="180" fill="url(#edge-fade)"/>
    </mask>
  </defs>
  <style>
    .wave { animation: drift 6s ease-in-out infinite alternate; }
    .wave-back { animation-duration: 9s; animation-direction: alternate-reverse; }
    .wave-front { animation-duration: 7s; }
    .cursor { animation: blink 1.6s steps(1, end) infinite; }
    @keyframes drift {
      from { transform: translate(-100px, -7px); }
      to { transform: translate(100px, 7px); }
    }
    @keyframes blink {
      0%, 55%, 100% { opacity: 1; }
      56%, 99% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) { .greeting { fill: #DCEEF8; } }
    @media (prefers-reduced-motion: reduce) {
      .wave, .cursor { animation: none; }
    }
  </style>
  <g mask="url(#soft-edges)">
    <path class="wave wave-back" d="M-200 58 C60 12 230 100 470 56 S830 20 1060 57 S1300 95 1400 52 L1400 76 C1180 120 1030 56 800 76 S440 120 220 79 S-60 52-200 80Z" fill="url(#lavender)" opacity="0.4"/>
    <path class="wave" d="M-200 105 C60 55 240 143 480 104 S830 65 1060 101 S1300 145 1400 99 L1400 126 C1180 163 1010 98 800 120 S450 157 220 121 S-60 94-200 130Z" fill="url(#blue)" opacity="0.5"/>
    <path class="wave wave-front" d="M-200 132 C40 95 260 166 510 128 S860 96 1090 132 S1310 161 1400 125 L1400 144 C1200 176 1040 135 820 146 S450 175 220 144 S-50 126-200 151Z" fill="url(#lavender)" opacity="0.5"/>
  </g>
  <g class="greeting" fill="#243B53" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', monospace" font-size="42" font-weight="500">
    <text x="600" y="90" dy="0.35em" text-anchor="middle">Hello, world!</text>
    <text class="cursor" x="765" y="90" dy="0.35em" aria-hidden="true">_</text>
  </g>
</svg>
